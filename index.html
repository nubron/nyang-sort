<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7E8CF">
<title>냥소트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap">
<style>
:root{
  --ink:#4A3420; --muted:#8C6E52; --cream:#FFF6E8; --paper:#FFF8EC; --accent:#E2683C; --accent-d:#B84B24;
  --btn-shadow:#D3B48A; --line:#E0CDB1; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#EFD3AC}
body{color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
svg symbol{overflow:visible}
.app{position:fixed;inset:0;max-width:520px;margin:0 auto;overflow:hidden;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background:radial-gradient(rgba(170,110,50,.13) 1.6px,transparent 2px) 0 0/22px 22px,linear-gradient(#F7E8CF,#EFD3AC)}
.floor{position:absolute;left:0;right:0;top:72%;bottom:0;border-top:4px solid #9A6436;
  background:repeating-linear-gradient(90deg,#C48A55 0 58px,#B67C48 58px 60px)}

/* 위 막대 */
.top{position:relative;z-index:3;flex:none;height:60px;display:flex;align-items:center;justify-content:space-between;padding:8px 14px 0}
.round{width:44px;height:44px;border-radius:50%;border:0;padding:0;background:var(--cream);color:#6B4524;display:grid;place-items:center;box-shadow:0 3px 0 #D9BC94}
.round:disabled{opacity:.45;cursor:default}
.sign{background:#8E5A2E;color:#FFF3DC;font-weight:700;font-size:17px;padding:7px 20px;border-radius:12px;box-shadow:0 3px 0 #6A3F1C;white-space:nowrap}
.moves{min-width:72px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--cream);border-radius:22px;padding:6px 14px 6px 10px;
  font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 #D9BC94}
.moves .paw{width:20px;height:20px;fill:#C9733F;flex:none}

/* 판 */
.stage{position:relative;flex:1;min-height:0}
.board{position:absolute;inset:0}
.shelf{position:absolute;height:calc(var(--w)*.14);border-radius:3px;background:#A8713F;box-shadow:0 4px 0 #84552B,0 10px 12px rgba(80,40,10,.18)}
.box{position:absolute;width:var(--w);height:calc(var(--w)*2.275);background:#D9A466;border:2px solid #8E5E30;border-radius:4px 4px 7px 7px;cursor:pointer;outline:none}
.box::before{content:"";position:absolute;left:calc(var(--w)*-.14);right:calc(var(--w)*-.14);top:calc(var(--w)*-.64);bottom:-2px}
.box:focus-visible{box-shadow:0 0 0 3px #fff,0 0 0 6px #8E5A2E}
.inside{position:absolute;left:calc(var(--w)*.06);right:calc(var(--w)*.06);top:0;bottom:0;border-radius:2px;
  background:linear-gradient(#5E3B1F,#7A4D2A 40%,#6C4425)}
.front{position:absolute;z-index:2;left:-2px;right:-2px;bottom:-2px;height:calc(var(--w)*.22);background:#DCA86A;border:2px solid #8E5E30;border-radius:3px 3px 7px 7px}
.front::after{content:"";position:absolute;left:50%;top:-2px;width:22%;height:calc(100% + 2px);transform:translateX(-50%);background:rgba(255,236,200,.55)}
.flaps{position:absolute;top:calc(var(--w)*-.24);left:calc(var(--w)*-.15);width:calc(var(--w)*1.3);height:calc(var(--w)*.26);overflow:visible}
.flaps path{fill:#E2B077;stroke:#8E5E30;stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.flaps .fb{fill:#C38C52}
.box.sel{box-shadow:0 0 0 3px #FFE1AE,0 0 24px rgba(255,186,90,.85)}
.box.tgt{box-shadow:0 0 0 3px rgba(226,104,60,.5)}
.box.hfrom{box-shadow:0 0 0 3px #FFE1AE}
.box.hto{outline:3px dashed #FFF3DC;outline-offset:3px}
.box.hto .inside{background:linear-gradient(#9E6838,#B98149 45%,#A8743F)}
.box.done{background:#E0B074}
.box.bad{animation:shake .36s ease-in-out}
@keyframes shake{20%{transform:translateX(-5px) rotate(-2deg)}45%{transform:translateX(5px) rotate(2deg)}70%{transform:translateX(-3px) rotate(-1deg)}}
.cat{position:absolute;z-index:1;left:calc(var(--w)*.125);bottom:calc(var(--w)*(.1 + var(--i)*.5));width:calc(var(--w)*.75);height:calc(var(--w)*.5625);
  overflow:visible;pointer-events:none;transition:transform .16s ease-out}
.cat.lift{z-index:4;transform:translateY(calc(var(--lift)*-1));filter:drop-shadow(0 8px 4px rgba(80,40,10,.25))}
.cat.nudge{z-index:4;animation:nudge 1.1s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(calc(var(--w)*-.2))}}
.cat.ghost{opacity:.68;filter:saturate(.7) brightness(1.12);animation:ghost 1.6s ease-in-out infinite}
@keyframes ghost{50%{opacity:.35}}
.cat .el{transform-origin:18px 15px;transition:transform .2s}
.cat .er{transform-origin:46px 15px;transition:transform .2s}
.cat.sad .el{transform:rotate(-32deg)}
.cat.sad .er{transform:rotate(32deg)}
.tgt-paw{position:absolute;z-index:3;top:calc(var(--w)*-.6);left:50%;width:calc(var(--w)*.36);height:calc(var(--w)*.36);margin-left:calc(var(--w)*-.18);
  fill:#E2683C;filter:drop-shadow(0 2px 0 #fff);animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
/* 다 모인 상자: 뚜껑을 닫고, 손잡이 구멍으로 잠든 얼굴이 보인다 */
.box.done{cursor:default}
.lid{position:absolute;z-index:5;left:-2px;right:-2px;top:-2px;bottom:-2px;background:#DCA86A;border:2px solid #8E5E30;border-radius:3px 3px 7px 7px;transform-origin:50% 0}
.lid::before{content:"";position:absolute;left:calc(var(--w)*-.09);right:calc(var(--w)*-.09);top:calc(var(--w)*-.16);height:calc(var(--w)*.2);border:2px solid #8E5E30;border-radius:4px;
  background:linear-gradient(90deg,transparent calc(50% - 1px),#8E5E30 calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px)),#E2B077}
.lid::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--w)*.2);border-top:2px solid rgba(142,94,48,.45);background:#D9A466}
.hole{position:absolute;left:8%;right:8%;top:calc(var(--w)*.3);height:calc(var(--w)*.5);border-radius:999px;overflow:hidden;background:#5E3B1F;border:2px solid #8E5E30;
  box-shadow:inset 0 3px 0 rgba(40,20,5,.35)}
.peek{position:absolute;left:50%;top:calc(var(--w)*-.13);width:calc(var(--w)*1.0);height:calc(var(--w)*.75);margin-left:calc(var(--w)*-.5);overflow:visible}
.zzz{position:absolute;z-index:6;top:calc(var(--w)*-.56);right:calc(var(--w)*-.12);font-weight:700;font-size:calc(var(--w)*.22);line-height:1;color:#7B5A9E;
  animation:float 2.4s ease-in-out infinite}
.zzz b{font-size:.78em;position:relative;top:-.45em;margin-left:1px}
.zzz b+b{font-size:.62em;top:-.95em}
@keyframes float{50%{transform:translateY(-3px)}}

/* 말풍선 · 토스트 */
.say{position:absolute;z-index:20;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.3;padding:7px 12px;border-radius:14px;white-space:nowrap;
  box-shadow:0 6px 14px rgba(60,30,10,.25);pointer-events:none;animation:pop .18s ease-out}
.say::after{content:"";position:absolute;bottom:-8px;left:var(--tx,50%);margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:var(--paper)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.toast{position:absolute;z-index:8;top:2px;left:50%;width:max-content;max-width:calc(100% - 24px);display:flex;align-items:center;gap:8px;padding:5px 14px 5px 8px;border-radius:18px;
  background:var(--paper);color:var(--ink);font-size:13.5px;line-height:1.3;box-shadow:0 5px 14px rgba(70,35,10,.2);
  opacity:0;transform:translate(-50%,-6px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.warn{background:#FFE9D6;color:#8A3B16;box-shadow:0 0 0 2px #F2B48A,0 5px 14px rgba(70,35,10,.2)}
.toast svg{width:30px;height:23px;flex:none}
.toast span{overflow:hidden;text-overflow:ellipsis}

/* 아래 막대 */
.bar{position:relative;z-index:3;flex:none;display:flex;justify-content:center;gap:clamp(12px,6vw,30px);padding:6px 16px 14px}
.btn{position:relative;width:clamp(78px,24vw,92px);height:clamp(58px,9.5vh,74px);border:0;padding:0;border-radius:20px;background:var(--cream);color:#6B4524;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:0 4px 0 var(--btn-shadow),0 10px 14px rgba(70,35,10,.2)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 var(--btn-shadow),0 6px 10px rgba(70,35,10,.2)}
.btn:disabled{opacity:.45;cursor:default;box-shadow:0 2px 0 var(--btn-shadow)}
.btn svg{width:26px;height:26px}
.lbl{font-size:14px;font-weight:700}
.badge{position:absolute;top:-7px;right:-7px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--accent);color:#fff;
  font:700 12px system-ui,sans-serif;display:grid;place-items:center;border:2px solid var(--cream)}
.btn.glow{box-shadow:0 4px 0 var(--btn-shadow),0 0 0 3px #FFE1AE,0 0 18px rgba(255,170,80,.9);animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{transform:translateY(-2px)}}

/* 바텀시트 */
.dim{position:absolute;inset:0;z-index:11;background:rgba(40,25,12,.35);opacity:0;pointer-events:none;transition:opacity .2s}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;z-index:12;left:0;right:0;bottom:0;background:var(--paper);border-radius:26px 26px 0 0;
  padding:10px 20px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;box-shadow:0 -8px 24px rgba(0,0,0,.18);
  transform:translateY(105%);visibility:hidden;transition:transform .28s ease-out,visibility 0s .28s}
.sheet.open{transform:none;visibility:visible;transition:transform .28s ease-out}
.handle{display:block;width:44px;height:5px;margin:0 auto 4px;border-radius:3px;background:var(--line)}
.sheet h2{margin:0;text-align:center;font-size:21px;color:#5A3A1E}
.sub{margin:0;text-align:center;color:var(--muted);font-size:14px}
.rate{display:flex;justify-content:center;gap:10px;margin:2px 0 4px}
.rate svg{width:34px;height:34px;fill:var(--line)}
.rate svg.on{fill:var(--accent);filter:drop-shadow(0 2px 0 #B84B24)}
.primary{height:52px;border:0;border-radius:18px;background:var(--accent);color:#fff;font-size:18px;font-weight:700;box-shadow:0 4px 0 var(--accent-d);
  display:flex;align-items:center;justify-content:center;gap:6px}
.primary:active{transform:translateY(2px);box-shadow:0 2px 0 var(--accent-d)}
.secondary{height:40px;border:0;background:transparent;color:var(--muted);font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px}

/* 튜토리얼 */
.tut{position:absolute;inset:0;z-index:10;pointer-events:none;display:none}
.tut.on{display:block}
.tut .spot{position:absolute;left:0;top:0}
.hand{position:absolute;width:40px;height:51px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35));transition:left .25s,top .25s}
.hand svg{width:100%;height:100%;transform:rotate(-12deg);animation:bob 1.1s ease-in-out infinite}
.bubble{position:absolute;left:16px;right:16px;background:var(--paper);border-radius:18px;padding:10px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.bubble svg{width:46px;height:35px;flex:none}
.bubble p{margin:0;font-size:15px;line-height:1.45}
.bubble b{color:#C2522B}
.bubble small{display:block;color:var(--muted);font-size:12px;margin-top:2px}

/* 손맛: 파티클 캔버스 · 콤보 글자 */
.tl{display:flex;gap:8px}
.fx{position:absolute;z-index:13;left:0;top:0;width:100%;height:100%;pointer-events:none}
.combo{position:absolute;z-index:9;font-weight:700;font-size:18px;color:var(--accent);white-space:nowrap;pointer-events:none;
  text-shadow:0 2px 0 var(--cream),0 0 6px var(--cream);transform:translateX(-50%);animation:combo .9s ease-out forwards}
@keyframes combo{from{opacity:0;transform:translate(-50%,6px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.12)}to{opacity:0;transform:translate(-50%,-26px)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
<defs><clipPath id="catclip"><rect x="6" y="9" width="52" height="37" rx="17"/></clipPath></defs>
<symbol id="paw" viewBox="0 0 24 24"><ellipse cx="12" cy="15.5" rx="5" ry="4.2"/><circle cx="6" cy="10" r="2.2"/><circle cx="10" cy="6.5" r="2.2"/><circle cx="14" cy="6.5" r="2.2"/><circle cx="18" cy="10" r="2.2"/></symbol>
<!-- 고양이 = 테두리(halo) + 왼귀 + 오른귀 + 몸(무늬) + 얼굴. 귀 색은 --el/--er/--ei 변수로 받는다. -->
<symbol id="halo" viewBox="0 0 64 48"><rect x="6" y="9" width="52" height="37" rx="17" fill="#FFF4E0" stroke="#FFF4E0" stroke-width="5"/></symbol>
<symbol id="earL" viewBox="0 0 64 48"><path d="M9 21 L13 2 L28 12 Z" fill="#FFF4E0" stroke="#FFF4E0" stroke-width="5" stroke-linejoin="round"/><path d="M9 21 L13 2 L28 12 Z" style="fill:var(--el)" stroke="#2A2420" stroke-width="2" stroke-linejoin="round"/><path d="M14 15 L15.5 7 L22 12 Z" style="fill:var(--ei)"/></symbol>
<symbol id="earR" viewBox="0 0 64 48"><path d="M36 12 L51 2 L55 21 Z" fill="#FFF4E0" stroke="#FFF4E0" stroke-width="5" stroke-linejoin="round"/><path d="M36 12 L51 2 L55 21 Z" style="fill:var(--er)" stroke="#2A2420" stroke-width="2" stroke-linejoin="round"/><path d="M42 12 L48.5 7 L50 15 Z" style="fill:var(--ei)"/></symbol>
<!-- a 치즈: 주황 + 이마 줄 3개 + 크림 턱 -->
<symbol id="cat-a" viewBox="0 0 64 48"><rect x="6" y="9" width="52" height="37" rx="17" fill="#F6AA45"/><g clip-path="url(#catclip)"><path d="M27 12v6M32 11v7M37 12v6" stroke="#B85E14" stroke-width="2.8" stroke-linecap="round"/><ellipse cx="32" cy="44" rx="17" ry="9" fill="#FFE6BF"/><ellipse cx="32" cy="35" rx="10" ry="7" fill="#FFE6BF"/></g><rect x="6" y="9" width="52" height="37" rx="17" fill="none" stroke="#2A2420" stroke-width="2"/></symbol>
<!-- b 턱시도: 검정 + 흰 가슴 -->
<symbol id="cat-b" viewBox="0 0 64 48"><rect x="6" y="9" width="52" height="37" rx="17" fill="#2E2C36"/><g clip-path="url(#catclip)"><path d="M32 15C28 21 21 28 19 35C17 42 21 47 32 47C43 47 47 42 45 35C43 28 36 21 32 15Z" fill="#FAF7F0"/></g><rect x="6" y="9" width="52" height="37" rx="17" fill="none" stroke="#2A2420" stroke-width="2"/></symbol>
<!-- c 고등어: 회청색 + M자 + 옆 줄무늬 -->
<symbol id="cat-c" viewBox="0 0 64 48"><rect x="6" y="9" width="52" height="37" rx="17" fill="#8E97A6"/><g clip-path="url(#catclip)"><g stroke="#3F4655" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M24 12l3.5 6 4.5-5 4.5 5 3.5-6"/><path d="M5 22q6 1 9 5M5 30q6 1 9 5M5 38q5 1 8 4M59 22q-6 1-9 5M59 30q-6 1-9 5M59 38q-5 1-8 4"/></g><ellipse cx="32" cy="35" rx="9" ry="6.5" fill="#D3D8E0"/></g><rect x="6" y="9" width="52" height="37" rx="17" fill="none" stroke="#2A2420" stroke-width="2"/></symbol>
<!-- d 삼색: 흰 바탕 + 왼쪽 주황 · 오른쪽 검정 큰 얼룩 -->
<symbol id="cat-d" viewBox="0 0 64 48"><rect x="6" y="9" width="52" height="37" rx="17" fill="#FBF5EA"/><g clip-path="url(#catclip)"><path d="M4 30C4 14 10 7 24 7C29 13 27 21 21 25C15 29 9 32 4 30Z" fill="#EE953A"/><path d="M60 33C60 16 54 8 41 8C37 14 39 22 45 26C50 30 56 34 60 33Z" fill="#2E2C36"/></g><rect x="6" y="9" width="52" height="37" rx="17" fill="none" stroke="#2A2420" stroke-width="2"/></symbol>
<!-- e 흰냥이: 무늬 없는 흰색 + 진분홍 귀 -->
<symbol id="cat-e" viewBox="0 0 64 48"><rect x="6" y="9" width="52" height="37" rx="17" fill="#FDFAF4"/><g clip-path="url(#catclip)"><ellipse cx="15" cy="32" rx="4" ry="2.4" fill="#F4B4B4" opacity=".7"/><ellipse cx="49" cy="32" rx="4" ry="2.4" fill="#F4B4B4" opacity=".7"/></g><rect x="6" y="9" width="52" height="37" rx="17" fill="none" stroke="#2A2420" stroke-width="2"/></symbol>
<!-- f 검은냥이: 무늬 없는 검정 -->
<symbol id="cat-f" viewBox="0 0 64 48"><rect x="6" y="9" width="52" height="37" rx="17" fill="#24222A"/><g clip-path="url(#catclip)"><path d="M14 14q6-3 12-2" stroke="#4A4756" stroke-width="2.4" fill="none" stroke-linecap="round"/></g><rect x="6" y="9" width="52" height="37" rx="17" fill="none" stroke="#2A2420" stroke-width="2"/></symbol>
<!-- g 회색: 무늬 없는 밝은 청회색 + 짙은 귀 -->
<symbol id="cat-g" viewBox="0 0 64 48"><rect x="6" y="9" width="52" height="37" rx="17" fill="#A9B6C9"/><rect x="6" y="9" width="52" height="37" rx="17" fill="none" stroke="#2A2420" stroke-width="2"/></symbol>
<!-- h 샴: 크림 몸 + 짙은 갈색 얼굴 가면 + 갈색 귀 -->
<symbol id="cat-h" viewBox="0 0 64 48"><rect x="6" y="9" width="52" height="37" rx="17" fill="#F2E6CF"/><g clip-path="url(#catclip)"><ellipse cx="32" cy="31" rx="15.5" ry="12.5" fill="#5A3F30"/></g><rect x="6" y="9" width="52" height="37" rx="17" fill="none" stroke="#2A2420" stroke-width="2"/></symbol>
<!-- i 젖소: 흰 바탕 + 검은 동그란 점 + 왼귀만 검정 -->
<symbol id="cat-i" viewBox="0 0 64 48"><rect x="6" y="9" width="52" height="37" rx="17" fill="#FDFAF4"/><g clip-path="url(#catclip)" fill="#2E2C36"><circle cx="12" cy="39" r="7.5"/><ellipse cx="47" cy="14" rx="9" ry="6"/><circle cx="51" cy="40" r="4.2"/><circle cx="32" cy="45" r="3"/></g><rect x="6" y="9" width="52" height="37" rx="17" fill="none" stroke="#2A2420" stroke-width="2"/></symbol>
<!-- j 카오스: 짙은 갈색 + 주황 얼룩 여러 개 -->
<symbol id="cat-j" viewBox="0 0 64 48"><rect x="6" y="9" width="52" height="37" rx="17" fill="#3B2A24"/><g clip-path="url(#catclip)" fill="#DE8B3C"><path d="M5 17c6-6 15-7 18-2s-2 10-9 11S2 23 5 17z"/><path d="M39 41c4-6 14-8 18-3s-1 10-8 11-12-2-10-8z"/><path d="M30 8c4 3 6 8 3 13-3-3-5-7-6-11z"/><circle cx="17" cy="42" r="3.2"/><circle cx="51" cy="24" r="2.4"/></g><rect x="6" y="9" width="52" height="37" rx="17" fill="none" stroke="#2A2420" stroke-width="2"/></symbol>
<!-- k 반반: 왼쪽 반 갈색 · 오른쪽 반 크림 (세로로 나뉨) -->

<!-- ===== 게임 로직: 화면과 분리된 순수 함수 (Unity C#으로 옮길 부분) ===== -->
<script id="nyang-logic">
var NyangLogic = (function () {
  'use strict';
  // 상자 하나에 들어가는 고양이 수
  var CAP = 4;
  // 상자 표현: 문자열. 왼쪽이 바닥, 오른쪽 끝이 맨 위. 무늬 i는 문자 'a'+i.
  // 판 표현: 상자 문자열의 배열.

  // 시드 기반 결정적 난수 (mulberry32)
  function makeRng(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  // 레벨 번호와 시도 번호를 섞어 시드를 만든다
  function seedFor(level, attempt) {
    var h = Math.imul(level ^ 0x9E3779B9, 0x85EBCA6B) ^ Math.imul(attempt + 1, 0xC2B2AE35);
    h ^= h >>> 13; h = Math.imul(h, 0x27D4EB2F); h ^= h >>> 16;
    return h >>> 0;
  }

  // 맨 위에서 같은 무늬가 몇 마리 연속인지
  function topRun(t) {
    var n = t.length;
    if (n === 0) return 0;
    var c = t.charCodeAt(n - 1), k = 1;
    while (k < n && t.charCodeAt(n - 1 - k) === c) k++;
    return k;
  }
  // 한 무늬로만 이루어졌는지 (빈 상자는 false)
  function isUniform(t) { return t.length > 0 && topRun(t) === t.length; }
  // 다 모인 상자: 한 무늬 4마리
  function isDoneTube(t) { return t.length === CAP && isUniform(t); }

  // i 상자에서 j 상자로 옮길 수 있는가
  function canMove(tubes, i, j) {
    if (i === j) return false;
    var a = tubes[i], b = tubes[j];
    if (a.length === 0 || b.length >= CAP) return false;
    if (b.length > 0 && b.charCodeAt(b.length - 1) !== a.charCodeAt(a.length - 1)) return false;
    return true;
  }
  // 옮긴 뒤의 새 판을 돌려준다 (원본은 바꾸지 않음). 들어갈 자리만큼 한꺼번에 옮긴다.
  function applyMove(tubes, i, j) {
    var a = tubes[i], b = tubes[j];
    var k = Math.min(topRun(a), CAP - b.length);
    var r = tubes.slice();
    r[i] = a.slice(0, a.length - k);
    r[j] = b + a.slice(a.length - k);
    return r;
  }
  // 몇 마리가 옮겨지는지 (화면 표시용)
  function moveCount(tubes, i, j) { return Math.min(topRun(tubes[i]), CAP - tubes[j].length); }

  function isSolved(tubes) {
    for (var i = 0; i < tubes.length; i++) {
      if (tubes[i].length !== 0 && !isDoneTube(tubes[i])) return false;
    }
    return true;
  }
  // 쓸모 있는 이동: 한 무늬뿐인 상자를 통째로 빈 상자로 옮기는 것은 제외
  function isUsefulMove(tubes, i, j) {
    if (!canMove(tubes, i, j)) return false;
    if (tubes[j].length === 0 && isUniform(tubes[i])) return false;
    return true;
  }
  function usefulMoves(tubes) {
    var out = [];
    for (var i = 0; i < tubes.length; i++) {
      var emptyTried = false;
      for (var j = 0; j < tubes.length; j++) {
        if (!isUsefulMove(tubes, i, j)) continue;
        if (tubes[j].length === 0) { if (emptyTried) continue; emptyTried = true; } // 빈 상자는 하나만 시도
        out.push([i, j]);
      }
    }
    return out;
  }
  // 상자 순서를 정렬한 상태 키 (순서만 다른 판은 같은 상태)
  function stateKey(tubes) { return tubes.slice().sort().join('|'); }

  // 하한 추정값: (연속 덩어리 수 - 무늬 수) + (바닥에 한 번도 없는 무늬 수)
  // 한 번 이동으로 많아야 1 줄어들므로 최소 이동 수를 넘지 않는다 (A* 최적 보장).
  function heuristic(tubes) {
    var seg = 0, bottomMask = 0, present = 0;
    for (var i = 0; i < tubes.length; i++) {
      var t = tubes[i];
      if (t.length === 0) continue;
      bottomMask |= 1 << (t.charCodeAt(0) - 97);
      seg++;
      present |= 1 << (t.charCodeAt(0) - 97);
      for (var k = 1; k < t.length; k++) {
        present |= 1 << (t.charCodeAt(k) - 97);
        if (t.charCodeAt(k) !== t.charCodeAt(k - 1)) seg++;
      }
    }
    var colors = 0, noBottom = 0;
    for (var c = 0; c < 26; c++) {
      if (present & (1 << c)) { colors++; if (!(bottomMask & (1 << c))) noBottom++; }
    }
    return seg - colors + noBottom;
  }

  // 우선순위 큐 (최소 힙)
  function Heap() { this.p = []; this.v = []; }
  Heap.prototype.push = function (pri, val) {
    var p = this.p, v = this.v, i = p.length;
    p.push(pri); v.push(val);
    while (i > 0) {
      var up = (i - 1) >> 1;
      if (p[up] <= pri) break;
      p[i] = p[up]; v[i] = v[up]; i = up;
    }
    p[i] = pri; v[i] = val;
  };
  Heap.prototype.pop = function () {
    var p = this.p, v = this.v, top = v[0];
    var lp = p.pop(), lv = v.pop(), n = p.length;
    if (n > 0) {
      var i = 0;
      while (true) {
        var l = 2 * i + 1, r = l + 1, m = i, mp = lp;
        if (l < n && p[l] < mp) { m = l; mp = p[l]; }
        if (r < n && p[r] < mp) { m = r; mp = p[r]; }
        if (m === i) break;
        p[i] = p[m]; v[i] = v[m]; i = m;
      }
      p[i] = lp; v[i] = lv;
    }
    return top;
  };
  Heap.prototype.size = function () { return this.p.length; };

  // A* 솔버. 결과: {status:'solved'|'unsolvable'|'limit', moves:[[from,to],...], expanded}
  // moves의 상자 번호는 입력 판의 상자 순서 그대로다.
  function solve(start, maxExpand) {
    maxExpand = maxExpand || 200000;
    if (isSolved(start)) return { status: 'solved', moves: [], expanded: 0 };
    var states = [start], parent = [-1], mv = [null], gs = [0];
    var best = new Map();
    best.set(stateKey(start), 0);
    var heap = new Heap();
    heap.push(heuristic(start) * 1024, 0);
    var expanded = 0;
    while (heap.size() > 0) {
      var id = heap.pop();
      var s = states[id], g = gs[id];
      if (best.get(stateKey(s)) < g) continue; // 더 짧은 길로 이미 처리됨
      if (isSolved(s)) {
        // 휴리스틱이 일관적이므로 처음 꺼낸 목표가 최소 이동 수
        var path = [], cur = id;
        while (parent[cur] !== -1) { path.push(mv[cur]); cur = parent[cur]; }
        path.reverse();
        return { status: 'solved', moves: path, expanded: expanded };
      }
      if (expanded >= maxExpand) return { status: 'limit', moves: null, expanded: expanded };
      expanded++;
      var ms = usefulMoves(s);
      for (var q = 0; q < ms.length; q++) {
        var ns = applyMove(s, ms[q][0], ms[q][1]);
        var key = stateKey(ns), ng = g + 1;
        var old = best.get(key);
        if (old !== undefined && old <= ng) continue;
        best.set(key, ng);
        var nid = states.length;
        states.push(ns); parent.push(id); mv.push(ms[q]); gs.push(ng);
        heap.push((ng + heuristic(ns)) * 1024 - ng, nid);
      }
    }
    return { status: 'unsolvable', moves: null, expanded: expanded };
  }

  // 레벨 구간별 설정
  function levelParams(level) {
    function lerp(lo, hi, from, to) {
      if (to <= from) return lo;
      var t = Math.min(1, Math.max(0, (level - from) / (to - from)));
      return lo + Math.floor(t * (hi - lo + 1 - 1e-9));
    }
    if (level <= 10) return { colors: lerp(3, 4, 1, 10), empties: 2 };
    if (level <= 50) return { colors: lerp(4, 6, 11, 50), empties: 2 };
    if (level <= 150) return { colors: lerp(7, 9, 51, 150), empties: 2 };
    // 151 이상: 151~300에서 10→12종, 빈 상자 2개
    return { colors: lerp(10, 12, 151, 300), empties: 2 };
  }

  // 튜토리얼 레벨 (손으로 만든 고정 배치). 생성기를 거치지 않는다.
  var TUTORIALS = {
    1: ['aaab', 'bbb', 'a', ''],              // 2종, 빈 상자 1, 최소 2수: 맨 위를 같은 무늬에 놓기
    2: ['aaab', 'bbba', ''],                  // 2종, 빈 상자 1, 최소 3수: 빈 상자 활용
    3: ['aabb', 'cc', 'ccaa', 'bb', '', '']   // 3종, 빈 상자 2, 최소 3수: 여러 마리 한꺼번에 옮기기
  };
  function tutorialLevel(level) {
    var tubes = TUTORIALS[level].slice();
    var colors = 0, empties = 0, seen = {};
    for (var i = 0; i < tubes.length; i++) {
      if (tubes[i].length === 0) empties++;
      for (var k = 0; k < tubes[i].length; k++) if (!seen[tubes[i][k]]) { seen[tubes[i][k]] = true; colors++; }
    }
    var r = solve(tubes, 60000); // 최소 이동 수 표시용
    return { level: level, colors: colors, empties: empties, tubes: tubes,
             minMoves: r.moves.length, solution: r.moves, attempts: 0, expanded: r.expanded, tutorial: true };
  }

  // 무작위 배치 하나 (빈 상자 포함)
  function randomBoard(colors, empties, rng) {
    var balls = [];
    for (var c = 0; c < colors; c++) for (var k = 0; k < CAP; k++) balls.push(String.fromCharCode(97 + c));
    for (var i = balls.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var tmp = balls[i]; balls[i] = balls[j]; balls[j] = tmp;
    }
    var tubes = [];
    for (var t = 0; t < colors; t++) tubes.push(balls.slice(t * CAP, t * CAP + CAP).join(''));
    for (var e = 0; e < empties; e++) tubes.push('');
    return tubes;
  }

  // 레벨 생성. 같은 레벨 번호는 항상 같은 결과.
  // 시도마다 시드를 바꾸고, 솔버가 상한 안에 못 풀거나 처음부터 다 모인 상자가 있으면 버린다.
  // 레벨 1~3은 튜토리얼 고정 배치를 돌려준다.
  function generateLevel(level, opts) {
    if (TUTORIALS[level]) return tutorialLevel(level);
    opts = opts || {};
    var maxExpand = opts.maxExpand || 60000;
    var p = levelParams(level);
    var totalExpanded = 0;
    for (var attempt = 0; ; attempt++) {
      var rng = makeRng(seedFor(level, attempt));
      var tubes = randomBoard(p.colors, p.empties, rng);
      var bad = false;
      for (var i = 0; i < tubes.length; i++) if (isDoneTube(tubes[i])) bad = true;
      if (bad) continue;
      var r = solve(tubes, maxExpand);
      totalExpanded += r.expanded;
      if (r.status === 'solved') {
        return { level: level, colors: p.colors, empties: p.empties, tubes: tubes,
                 minMoves: r.moves.length, solution: r.moves, attempts: attempt + 1, expanded: totalExpanded };
      }
    }
  }

  return {
    CAP: CAP, makeRng: makeRng, seedFor: seedFor, topRun: topRun, isUniform: isUniform, isDoneTube: isDoneTube,

  // ---- 토스트 · 말풍선 ----

  function clearToast() { clearTimeout(S.toastTimer); $('toast').className = 'toast'; }

  function say(i, text) {

    var el = document.createElement('div');
    el.className = 'say'; el.id = 'say'; el.textContent = text;

    var bub = $('tutBubble'), bh = bub.offsetHeight + 14;

  // ---- 배치 계산 ----
  function layout(n) {
    var st = $('stage'), W = st.clientWidth, H = st.clientHeight;

    var R = liftK + BOX_H + SHELF;

    for (var cols = 1; cols <= n; cols++) {
      var rows = Math.ceil(n / cols);

  // 들린 고양이가 상자 바로 위까지 올라가는 높이(px)
  function liftPx(i) {

    return (BOX_H + 0.06 - 0.1 - (n - 1) * 0.5) * w;
  }

  function catSVG(code, face, cls, k) {
    var p = PATTERNS[code.charCodeAt(0) - 97];
    return '<svg class="cat' + cls + '" viewBox="0 0 64 48" aria-hidden="true" style="--i:' + k + ';--el:' + p.el + ';--er:' + p.er + ';--ei:' + p.ei +
      (p.mouth ? ';--mouth:' + p.mouth : '') + '"><use href="#halo"/><use class="el" href="#earL"/><use class="er" href="#earR"/><use href="#cat-' + p.id +
      '"/><use href="#face-' + face + '"/></svg>';
  }
  var FLAPS = '<svg class="flaps" viewBox="0 0 100 20" preserveAspectRatio="none" aria-hidden="true"><path class="fb" d="M24 19 L29 5 H71 L76 19Z"/><path d="M11 19 L1 3 L17 0 L27 19Z"/><path d="M89 19 L99 3 L83 0 L73 19Z"/></svg>';
  var PAW = '<svg class="tgt-paw" aria-hidden="true"><use href="#paw"/></svg>';

  function boxEl(i) { return $('board').querySelector('.box[data-i="' + i + '"]'); }

  function render() {
    if (!S.gen) return;
    var t = S.tubes;
    $('sLevel').textContent = S.level;
    $('sMoves').textContent = S.moves;

      } else {

      }
    }

    var hintN = S.hint ? L.moveCount(t, S.hint[0], S.hint[1]) : 0;
    for (var i = 0; i < t.length; i++) {
      var tube = t[i], len = tube.length, done = L.isDoneTube(tube);
      var cls = 'box';
      if (i === sel) cls += ' sel';
      var tgt = sel >= 0 && i !== sel && L.canMove(t, sel, i);
      if (tgt) cls += ' tgt';
      if (done) cls += ' done';
      if (S.hint && S.hint[0] === i) cls += ' hfrom';
      if (S.hint && S.hint[1] === i) cls += ' hto';
      var run = i === sel ? L.topRun(tube) : 0;
      var names = [];
      var inner = (done ? '' : FLAPS) + '<i class="inside"></i>';
      for (var k = 0; k < len; k++) {
        var top = k >= len - run, nudge = S.hint && S.hint[0] === i && k >= len - hintN;
        var sad = S.sad && S.sad.box === i && k >= len - S.sad.n;
        var face = done ? 'z' : top ? 'u' : sad ? 's' : 'n';
        inner += catSVG(tube[k], face, top ? ' lift' : nudge ? ' nudge' : sad ? ' sad' : '', k);
        names.push(PATTERNS[tube.charCodeAt(k) - 97].name);
      }
      if (S.hint && S.hint[1] === i) {
        var src = t[S.hint[0]];
        for (var g = 0; g < hintN; g++) inner += catSVG(src[src.length - 1], 'n', ' ghost', len + g);
      }
      inner += '<i class="front"></i>';
      if (done) inner += '<i class="lid"><i class="hole">' + catSVG(tube[0], 'z', '', 0).replace('class="cat', 'class="peek') + '</i></i><span class="zzz" aria-hidden="true">z<b>z</b><b>z</b></span>';
      if (tgt) inner += PAW;
      var label = (i + 1) + '번 상자, ' + (done ? names[0] + ' 4마리가 잠들었어요' : len ? names.join(', ') + ' (아래부터)' : '비어 있음');
      html += '<div class="' + cls + '" data-i="' + i + '" role="button" tabindex="0"' + (done ? ' aria-disabled="true"' : '') + ' aria-label="' + label + '" style="left:' + lay.boxes[i].x +
        'px;top:' + lay.boxes[i].y + 'px' + (run ? ';--lift:' + liftPx(i) + 'px' : '') + '">' + inner + '</div>';
    }

    if (S.tut) updateTut();
  }

  // ---- 움직임 ----
  function catRects(i, k) {
    var el = boxEl(i); if (!el) return null;
    var cats = el.querySelectorAll('.cat:not(.ghost)'), out = [];
    for (var j = cats.length - k; j < cats.length; j++) out.push(cats[j].getBoundingClientRect());
    return out;
  }
  // 고양이가 원래 상자에서 새 상자로 포물선을 그리며 날아간다
  function flyCats(to, k, start) {
    if (RM || !start) return;
    var el = boxEl(to); if (!el || !el.animate) return;
    var cats = el.querySelectorAll('.cat:not(.ghost)');
    var first = cats.length - k, arc = S.lay.w * 0.6;
    for (var j = 0; j < k; j++) {
      var c = cats[first + j]; if (!c || !start[j]) continue;
      var r = c.getBoundingClientRect();
      var dx = start[j].left - r.left, dy = start[j].top - r.top;
      c.style.zIndex = 30;
      c.animate([
        { transform: 'translate(' + dx + 'px,' + dy + 'px)' },
        { transform: 'translate(' + dx * 0.5 + 'px,' + (Math.min(dy, 0) * 0.5 - arc) + 'px)', offset: 0.45 },
        { transform: 'translate(0,0)' }
      ], { duration: 260 + j * 30, easing: 'ease-in-out' });
    }
  }
  // 마지막 고양이가 내려앉으면 날개를 접고 뚜껑을 덮는다
  function closeLid(i, k) {
    if (RM) return;
    var el = boxEl(i); if (!el || !el.animate) return;
    var lid = el.querySelector('.lid'); if (!lid) return;
    var delay = 260 + (k - 1) * 30, dur = 360;
    var tmp = document.createElement('div'); tmp.innerHTML = FLAPS;
    var flaps = tmp.firstChild; flaps.style.transformOrigin = '50% 100%';
    el.insertBefore(flaps, el.firstChild);
    flaps.animate([{ transform: 'none' }, { transform: 'scaleY(-.2)', opacity: 0 }],
      { duration: dur * 0.5, delay: delay, easing: 'ease-in', fill: 'forwards' }).onfinish = function () { if (flaps.parentNode) flaps.parentNode.removeChild(flaps); };
    lid.animate([{ transform: 'perspective(' + S.lay.w * 4 + 'px) rotateX(-90deg)' }, { transform: 'none' }],
      { duration: dur, delay: delay, easing: 'cubic-bezier(.3,.7,.4,1.15)', fill: 'backwards' });
    // 날아온 고양이가 뚜껑 위로 비치지 않게 순서를 되돌린다
    var cats = el.querySelectorAll('.inside ~ .cat');
    setTimeout(function () { for (var j = 0; j < cats.length; j++) cats[j].style.zIndex = ''; }, delay);
    var z = el.querySelector('.zzz');
    if (z) z.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, delay: delay + dur, fill: 'backwards' });
  }
  function bounceBack(i, n, lift) {
    if (RM) return;
    var el = boxEl(i); if (!el || !el.animate) return;
    var cats = el.querySelectorAll('.cat:not(.ghost)'), hop = S.lay.w * 0.12;
    for (var j = cats.length - n; j < cats.length; j++) {
      cats[j].animate([
        { transform: 'translateY(' + -lift + 'px)' },
        { transform: 'translateY(0)', offset: 0.55 },
        { transform: 'translateY(' + -hop + 'px)', offset: 0.78 },
        { transform: 'translateY(0)' }
      ], { duration: 420, easing: 'ease-in' });
    }
  }
  function shake(i) {
    var el = boxEl(i); if (!el) return;
    el.classList.remove('bad'); void el.offsetWidth; el.classList.add('bad');
  }

  // ---- 손맛: 소리 (Web Audio로 합성) ----
  var SND_KEY = 'nyangsort.sound';
  var sndOn = true;
  try { sndOn = localStorage.getItem(SND_KEY) !== '0'; } catch (e) {}
  var AC = null;
  // 첫 터치 때 만들고, 멈춰 있으면 다시 깨운다
  function audio() {
    if (!sndOn) return null;
    if (!AC) {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      try { AC = new C(); } catch (e) { return null; }
    }
    if (AC.state === 'suspended') { try { AC.resume(); } catch (e) {} }
    return AC;
  }
  // 음 하나: 주파수 f(→f2로 미끄러짐), at초 뒤 시작, dur초 길이, 최대 음량 vol
  function tone(f, at, dur, type, vol, f2) {
    var ac = audio(); if (!ac) return;
    var t = ac.currentTime + (at || 0);
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur * 0.8);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.03);
  }
  function sfxPop(at, k) { tone(420 + k * 40, at, 0.11, 'sine', 0.13, 760 + k * 60); }
  function sfxBonk() { tone(190, 0, 0.18, 'triangle', 0.14, 110); }
  // 콤보가 이어질수록 오음계로 한 칸씩 높아진다
  var STEPS = [0, 2, 4, 7, 9, 12, 14, 16];
  function sfxChime(combo) {
    var f = 784 * Math.pow(2, STEPS[Math.min(combo, STEPS.length) - 1] / 12);
    tone(f, 0, 0.55, 'sine', 0.11);
    tone(f * 2, 0, 0.3, 'sine', 0.03);
    tone(f * 1.5, 0.07, 0.5, 'sine', 0.07);
  }
  function sfxFanfare() {
    var notes = [523.25, 659.25, 783.99, 1046.5];
    for (var n = 0; n < notes.length; n++) tone(notes[n], n * 0.1, n === 3 ? 0.7 : 0.22, 'triangle', 0.1);
    tone(1318.5, 0.4, 0.6, 'sine', 0.05);
  }
  function vib(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
  var SPK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>';
  function drawSound() {
    $('bSound').innerHTML = SPK + (sndOn ? '<path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>' : '<path d="M16 9.5l5 5M21 9.5l-5 5"/>') + '</svg>';
    $('bSound').setAttribute('aria-label', sndOn ? '소리 끄기' : '소리 켜기');
  }
  function toggleSound() {
    sndOn = !sndOn;
    try { localStorage.setItem(SND_KEY, sndOn ? '1' : '0'); } catch (e) {}
    drawSound();
    if (sndOn) sfxPop(0, 0);
  }

  // ---- 손맛: 파티클 (캔버스 하나, 남은 게 없으면 rAF를 멈춘다) ----
  var FX = { ps: [], raf: 0, last: 0, w: 0, h: 0, d: 1 };
  var WARM = ['#F6AA45', '#E2683C', '#F3B8B0', '#FFD27A', '#EE8C9A'];
  var MAX_P = 120;
  function fxSize() {
    var cv = $('fx'), app = $('app'), d = Math.min(2, window.devicePixelRatio || 1);
    FX.w = app.clientWidth; FX.h = app.clientHeight; FX.d = d;
    var pw = Math.round(FX.w * d), ph = Math.round(FX.h * d);
    if (cv.width !== pw || cv.height !== ph) { cv.width = pw; cv.height = ph; }
  }
  function addP(p) {
    if (FX.ps.length >= MAX_P) return;
    p.life = 0; p.rot = p.rot || 0; p.ph = Math.random() * 6.3;
    FX.ps.push(p);
  }
  function runFx() {
    if (FX.raf) return;
    FX.last = performance.now();
    FX.raf = requestAnimationFrame(stepFx);
  }
  function stepFx(now) {
    var c = $('fx').getContext('2d'), dt = Math.min(3, (now - FX.last) / 16.7);
    FX.last = now;
    c.setTransform(FX.d, 0, 0, FX.d, 0, 0);
    c.clearRect(0, 0, FX.w, FX.h);
    for (var n = FX.ps.length - 1; n >= 0; n--) {
      var p = FX.ps[n];
      p.life += dt;
      if (p.life >= p.max) { FX.ps.splice(n, 1); continue; }
      var dr = Math.pow(p.drag, dt);
      p.vx *= dr; p.vy = p.vy * dr + p.g * dt;
      p.x += (p.vx + Math.sin(p.life * 0.08 + p.ph) * p.sway) * dt;
      p.y += p.vy * dt; p.rot += p.vr * dt;
      drawP(c, p);
    }
    FX.raf = FX.ps.length ? requestAnimationFrame(stepFx) : 0;
  }
  // 모양: 0 별 · 1 하트 · 2 Z
  function drawP(c, p) {
    var s = p.s;
    c.save();
    c.globalAlpha = Math.min(1, (p.max - p.life) / 18, p.life / 4);
    c.translate(p.x, p.y); c.rotate(p.rot);
    c.fillStyle = p.c;
    if (p.k === 2) {
      c.font = '700 ' + Math.round(s * 1.7) + 'px "Gowun Dodum",sans-serif';
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText('Z', 0, 0);
    } else {
      c.beginPath();
      if (p.k === 0) {
        for (var q = 0; q < 10; q++) {
          var r = q % 2 ? s * 0.45 : s, a = q * Math.PI / 5 - Math.PI / 2;
          c.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        }
        c.closePath();
      } else {
        c.moveTo(0, s * 0.7);
        c.bezierCurveTo(-s * 1.3, -s * 0.1, -s * 0.6, -s * 1.1, 0, -s * 0.35);
        c.bezierCurveTo(s * 0.6, -s * 1.1, s * 1.3, -s * 0.1, 0, s * 0.7);
      }
      c.fill();
      c.lineWidth = 1.2; c.strokeStyle = 'rgba(74,52,32,.5)'; c.stroke();
    }
    c.restore();
  }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  // 상자 뚜껑 위에서 별 · 하트가 퐁 튀고, Z가 둥실 떠오른다
  function boxBurst(i) {
    var el = boxEl(i); if (!el) return;
    fxSize();
    var r = el.getBoundingClientRect(), ar = $('app').getBoundingClientRect();
    var x = r.left - ar.left + r.width / 2, y = r.top - ar.top;
    var p = PATTERNS[S.tubes[i].charCodeAt(0) - 97];
    var cols = WARM.concat([p.el, p.ei]);
    for (var n = 0; n < 34; n++) {
      var a = -Math.PI / 2 + rnd(-1.2, 1.2), sp = rnd(2, 5);
      addP({ x: x + rnd(-6, 6), y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 0.13, drag: 0.975, max: rnd(42, 62),
             rot: rnd(-1, 1), vr: rnd(-0.12, 0.12), s: rnd(5, 9), k: n % 3 ? 0 : 1, c: pick(cols), sway: 0 });
    }
    for (var z = 0; z < 4; z++) {
      addP({ x: x + rnd(-10, 14), y: y - z * 6, vx: rnd(0.2, 0.6), vy: rnd(-1.3, -0.8), g: 0, drag: 0.99, max: rnd(60, 80),
             rot: rnd(-0.3, 0.3), vr: 0, s: 6 + z * 1.5, k: 2, c: '#7B5A9E', sway: 0.4 });
    }
    runFx();
  }
  // 화면이 살짝 흔들린다 (몇 px, 0.2초)
  function bump() {
    var st = $('stage'); if (RM || !st.animate) return;
    st.animate([{ transform: 'none' }, { transform: 'translate(-3px,2px)' }, { transform: 'translate(3px,-2px)' },
                { transform: 'translate(-2px,1px)' }, { transform: 'none' }], { duration: 200, easing: 'ease-out' });
  }
  function comboText(i, n) {
    var b = S.lay && S.lay.boxes[i]; if (!b) return;
    var el = document.createElement('div');
    el.className = 'combo'; el.textContent = '콤보 x' + n;
    el.style.left = (b.x + S.lay.w / 2) + 'px';
    el.style.top = Math.max(2, b.y - S.lay.w * 1.1) + 'px';
    $('stage').appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 900);
  }
  // 고양이가 내려앉을 때: 눌렸다 펴지는 몸짓 + 퐁. 상자가 다 차면 뚜껑이 닫힐 즈음 반짝.
  function landFx(i, k) {
    var done = L.isDoneTube(S.tubes[i]);
    S.combo = done ? S.combo + 1 : 0;
    var land = RM ? 0 : 260 + (k - 1) * 30;
    sfxPop(land / 1000, k - 1);
    var el = boxEl(i);
    if (!RM && el && el.animate) {
      var cats = el.querySelectorAll('.cat:not(.ghost)'), first = cats.length - k;
      for (var j = 0; j < k; j++) {
        var c = cats[first + j]; if (!c) continue;
        c.animate([
          { transform: 'none', transformOrigin: '50% 100%' },
          { transform: 'scale(1.16,.82)', transformOrigin: '50% 100%', offset: 0.35 },
          { transform: 'scale(.94,1.07)', transformOrigin: '50% 100%', offset: 0.7 },
          { transform: 'none', transformOrigin: '50% 100%' }
        ], { duration: 220, delay: 260 + j * 30, easing: 'ease-out' });
      }
    }
    if (!done) return;
    var combo = S.combo;
    setTimeout(function () {
      if (!S.tubes[i] || !L.isDoneTube(S.tubes[i])) return; // 그사이 되돌렸으면 건너뛴다
      sfxChime(combo); vib(30);
      if (combo >= 2) comboText(i, combo);
      if (RM) return;
      boxBurst(i); bump();
    }, RM ? 0 : land + 240);
  }
  // 클리어: 화면 가득 별 · 하트 · Z가 내려오고, 올라가는 팡파르
  function celebrate() {
    sfxFanfare(); vib([30, 50, 30, 50, 80]);
    if (RM) return;
    fxSize();
    for (var n = 0; n < 80; n++) {
      addP({ x: rnd(0, FX.w), y: rnd(-FX.h * 0.45, -10), vx: rnd(-0.6, 0.6), vy: rnd(1.4, 3), g: 0.025, drag: 0.995, max: rnd(150, 200),
             rot: rnd(-1, 1), vr: rnd(-0.06, 0.06), s: rnd(5, 10), k: n % 6 === 0 ? 2 : n % 2, c: n % 6 === 0 ? '#7B5A9E' : pick(WARM), sway: rnd(0.4, 1.1) });
    }
    runFx();
  }

  // ---- 입력 ----
  $('board').addEventListener('click', function (e) {
    var b = e.target.closest('.box');
    if (b) onTap(+b.getAttribute('data-i'));
  });
  $('board').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var b = e.target.closest('.box');
    if (b) { e.preventDefault(); onTap(+b.getAttribute('data-i')); }
  });
  // 튜토리얼 중에는 밝힌 두 상자만 누를 수 있고, 다른 곳을 누르면 닫힌다
  document.addEventListener('click', function (e) {
    if (!S.tut) return;
    var b = e.target.closest && e.target.closest('.box');
    if (b) {
      var i = +b.getAttribute('data-i');
      if (i === S.tut.from || i === S.tut.to) return;
    }
    e.stopPropagation(); e.preventDefault();
    endTut(true);
  }, true);
  // 첫 터치에 오디오를 깨운다 (브라우저 자동재생 제한)
  document.addEventListener('pointerdown', audio, true);
  document.addEventListener('keydown', audio, true);
  $('bSound').addEventListener('click', toggleSound);
  drawSound();
  $('bUndo').addEventListener('click', undo);
  $('bAdd').addEventListener('click', addTube);
  $('bHint').addEventListener('click', hint);
  $('bPause').addEventListener('click', function () { if (!S.cleared) openSheet('pause'); });
  $('bResume').addEventListener('click', closeSheets);
  $('dim').addEventListener('click', closeSheets);
  $('bRestart').addEventListener('click', function () { closeSheets(); if (!S.busy && S.gen) resetBoard(); });
  $('bNext').addEventListener('click', function () { if (!S.busy && S.cleared) startLevel(S.level + 1); });
  $('bRetry').addEventListener('click', function () { if (!S.busy && S.gen) resetBoard(); });
  var resizeT = 0;
  window.addEventListener('resize', function () { clearTimeout(resizeT); resizeT = setTimeout(render, 60); });

  startLevel(loadLevel());
})();
</script>
</body>
